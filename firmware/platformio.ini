; Fafobot firmware build configuration.
;
; Board: ESP32-S3-DevKitC-1 (ESP32-S3-WROOM-1). The N8R8 variant with octal PSRAM works
; unchanged -- config.h avoids GPIO33-37 so one pin map fits both.
;
; PLATFORM PINNING: this targets the espressif32 6.x platform, which ships Arduino-ESP32
; 2.0.x on ESP-IDF 4.4. That combination provides the legacy `driver/i2s.h` API used by
; audio_input.cpp and audio_output.cpp. Arduino-ESP32 3.x replaces it with `i2s_std.h`,
; which is a breaking change. All I2S calls are confined to those two files precisely so
; that migration is a contained piece of work rather than a sweep.

[platformio]
default_envs = fafobot

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; -Werror is deliberate. On an MCU, "unused variable" and "sign compare" warnings are
; usually a bug you will otherwise find with an oscilloscope.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; ---------------------------------------------------------------------------------------
; Main application
; ---------------------------------------------------------------------------------------
[env:fafobot]
build_src_filter = +<*> -<../selftest/>
build_flags =
    ${env.build_flags}
    -I include
    -I src

; ---------------------------------------------------------------------------------------
; Self-tests. Each is a standalone sketch that exercises one subsystem, so a wiring fault
; can be isolated before the whole robot is assembled. Flash order is in
; docs/HARDWARE.md#assembly-order.
;
;   pio run -e oled_test -t upload
; ---------------------------------------------------------------------------------------
[env:oled_test]
build_src_filter = +<../selftest/oled_test.cpp>
build_flags = ${env.build_flags} -I include -I src

[env:mic_test]
build_src_filter = +<../selftest/mic_test.cpp>
build_flags = ${env.build_flags} -I include -I src

[env:speaker_test]
build_src_filter = +<../selftest/speaker_test.cpp>
build_flags = ${env.build_flags} -I include -I src

[env:touch_test]
build_src_filter = +<../selftest/touch_test.cpp>
build_flags = ${env.build_flags} -I include -I src

[env:full_io_test]
build_src_filter = +<../selftest/full_io_test.cpp>
build_flags = ${env.build_flags} -I include -I src
